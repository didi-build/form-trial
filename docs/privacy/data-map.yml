schema_version: 1
d1_tables:
  trial_notes:
    defaults:
      whose: operational
      data: short test notes written by hand, never personal data
      purpose: checks that Foreman applies D1 migrations on staging (Foreman ADR 0118 slice 8)
      storage: D1
      processors: [Cloudflare]
      retention: until the throwaway project is removed
    columns:
      id: {}
      note: {}
      created_at: {}
other_items:
  - id: d1-db
    binding: DB
    whose: operational
    data: the project's D1 database as a store; its tables and columns are declared under d1_tables
    purpose: the Worker's database, behind /api
    storage: D1
    processors: [Cloudflare]
    retention: per table, as declared under d1_tables
    source: wrangler.jsonc
